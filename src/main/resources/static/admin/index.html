<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>栖心 SPA · 运营工作台</title><link rel="stylesheet" href="admin.css"></head>
<body>
<section id="login" class="login-layout">
  <div class="brand-story"><div class="brand-mark">栖</div><p class="eyebrow">QIXIN · SPA & WELLNESS</p><h1>让每一段时光，<br>都被妥善照顾。</h1><p>栖心运营工作台<br>从有序的排班，开始从容的一天。</p><div class="story-footer">预约 · 排班 · 客户体验</div></div>
  <div class="login-panel"><form id="login-form"><p class="eyebrow">WELCOME BACK</p><h2>欢迎回到栖心</h2><p class="muted">使用管理员账号进入门店工作台</p><label>登录身份<select name="loginRole"><option value="ADMIN">管理员</option><option value="STAFF">技师</option></select></label><label>账号<input name="username" autocomplete="username" required placeholder="管理员账号"></label><label>密码<input name="password" type="password" autocomplete="current-password" required placeholder="请输入密码"></label><p id="login-error" role="alert" class="error"></p><button class="primary" type="submit">登录工作台 <span>→</span></button><p class="fine">仅授权人员可访问。所有排班与审批操作均由服务端校验。</p></form></div>
</section>
<div id="workspace" class="workspace" hidden>
 <aside><a class="brand" href="#overview"><span class="brand-mark small">栖</span><span>栖心 SPA<small>运营管理工作台</small></span></a><p class="nav-label">门店运营</p><nav id="nav"><button data-view="overview">◈ <span>工作台概览</span></button><button data-view="calendar">▦ <span>排班日历</span></button><button data-view="rules">☷ <span>每周固定规则</span></button><button data-view="leaves">◷ <span>请假与审批</span><i id="pending-count"></i></button><button data-view="business">◇ <span>营业与特殊日期</span></button><button data-view="orders">▤ <span>预约与订单</span></button><button data-view="catalog">✧ <span>服务与技师</span></button><button data-view="content">▧ <span>运营内容</span></button></nav><div class="sidebar-bottom"><span class="online-dot"></span> 服务端实时数据 <button id="logout" class="text-button">退出登录</button></div></aside>
 <div class="main-column"><header><div><span class="muted">门店工作台</span><span class="header-divider">/</span><strong id="breadcrumb">概览</strong></div><div class="account"><span class="avatar">栖</span><span id="account-name">管理员</span></div></header><main><div class="page-heading"><div><p class="eyebrow" id="page-eyebrow">YOUR DAILY OVERVIEW</p><h1 id="page-title">工作台概览</h1><p id="page-description" class="muted">从这里，安排门店的每一天。</p></div><button class="secondary" id="refresh">↻ 刷新数据</button></div><section id="content" aria-live="polite"></section></main><footer>栖心 SPA · 用心安排每一次相遇 <span id="updated-at"></span></footer></div>
</div>
<div id="notice" class="operation-toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
<dialog id="editor"><form id="editor-form" novalidate><div class="dialog-header"><div><p class="eyebrow">QIXIN WORKSPACE</p><h2 id="dialog-title"></h2></div><button type="button" id="close-dialog" class="icon-button" aria-label="关闭">×</button></div><div id="dialog-content"></div><p id="dialog-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-dialog" class="secondary">取消</button><button id="save-dialog" class="primary" type="submit">确认保存</button></div></form></dialog>
<dialog id="order-drawer" class="record-drawer" aria-labelledby="order-drawer-title"><div class="dialog-header"><h2 id="order-drawer-title">预约与订单详情</h2><button type="button" id="close-order-drawer" class="icon-button" aria-label="关闭详情">×</button></div><div id="order-drawer-body"></div></dialog>
<script src="order-records.js"></script><script src="finance.js"></script><script src="analytics.js"></script><script src="admin.js"></script></body></html>
