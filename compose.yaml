x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '5'}
  security_opt: [no-new-privileges:true]
services:
  mysql:
    <<: *runtime
    platform: linux/amd64
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      SPA_DEPLOYMENT_MODE: ${SPA_DEPLOYMENT_MODE:?required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?required}
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql.cnf:/etc/mysql/conf.d/spa.cnf:ro
      - ./db/schema/bootstrap.sql:/opt/spa/schema.sql:ro
      - ./deploy/init-empty.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./deploy/grant-app.sh:/opt/spa/grant-app.sh:ro
      - ./deploy/database-policy.sh:/opt/spa/database-policy.sh:ro
    networks: [data]
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -Nse "SELECT COUNT(*) FROM spa_order" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  redis:
    <<: *runtime
    platform: linux/amd64
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: [sh, /etc/spa/redis.sh]
    volumes:
      - redis-data:/data
      - ./deploy/redis.sh:/etc/spa/redis.sh:ro
    networks: [data]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    <<: *runtime
    platform: linux/amd64
    image: ${SPA_IMAGE:?required}
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?required}
      SPRING_CONFIG_LOCATION: file:/app/config/
      SPA_DEPLOYMENT_MODE: ${SPA_DEPLOYMENT_MODE:?required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?required}
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      SPA_AUTH_ADMIN_USERNAME: ${SPA_AUTH_ADMIN_USERNAME:?required}
      SPA_AUTH_ADMIN_PASSWORD_HASH: ${SPA_AUTH_ADMIN_PASSWORD_HASH:?required}
      SPA_WECHAT_APP_ID: ${SPA_WECHAT_APP_ID:-}
      SPA_WECHAT_APP_SECRET: ${SPA_WECHAT_APP_SECRET:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-local-unconfigured}
    volumes: [./deploy/config:/app/config:ro]
    networks: [data, web]
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, java, -cp, /app/health, com.lee.spa.ContainerHealthProbe]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  nginx:
    <<: *runtime
    platform: linux/amd64
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy_params:/etc/nginx/proxy_params_spa:ro
    ports: ['${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-18088}:80']
    networks: [web]
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/nginx-health']
      interval: 15s
      timeout: 5s
      retries: 5
networks:
  data: {internal: true}
  web: {}
volumes:
  mysql-data: {}
  redis-data: {}
