# Dedicated Redis for tests only; starts only after user prepares Docker.
services:
  redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    labels:
      com.spa.purpose: round2-acceptance
      com.spa.database: ${SPA_ACCEPTANCE_DB:?required}
    environment:
      REDIS_PASSWORD: ${SPA_ACCEPTANCE_REDIS_PASSWORD:?required}
    command: [sh, /etc/spa/redis.sh]
    ports: ['127.0.0.1:16379:6379']
    volumes:
      - ./deploy/redis.sh:/etc/spa/redis.sh:ro
      - redis-test-data:/data
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  redis-test-data: {}
