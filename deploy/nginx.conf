limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
log_format spa_safe '$time_iso8601 $request_method $status $request_time';
server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log spa_safe;
    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /health/ { return 404; }
    location /nginx-health { access_log off; return 200 'ok'; }
    location ~ ^/api/auth/(admin|staff|wechat|dev)-login$ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://app:8080;
        include /etc/nginx/proxy_params_spa;
    }
    location / {
        proxy_pass http://app:8080;
        include /etc/nginx/proxy_params_spa;
    }
}
